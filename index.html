<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rastreamento Profissional</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    body { margin:0; background:#0b0d0f; color:#00ffe1; font-family:Arial;}
    #map { height:50vh; }
    #hud { padding:10px; }
    input, button, select {
      width:100%; margin-top:6px; padding:10px;
      background:#0b0d0f; color:#00ffe1;
      border:1px solid #00ffe1; border-radius:8px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="hud">
  <p>🆔 Seu ID: <span id="meuId"></span></p>

  <button onclick="iniciar()">▶ Iniciar rastreamento</button>
  <button onclick="parar()">⏹ Parar rastreamento</button>

  <hr>

  <p>👥 Rastrear outro usuário</p>
  <input id="trackInput" placeholder="Digite o ID">
  <button onclick="rastrear()">Rastrear</button>

  <hr>

  <p>📍 Latitude: <span id="lat">--</span></p>
  <p>📍 Longitude: <span id="lon">--</span></p>
  <p>🎯 Precisão: <span id="acc">--</span></p>
</div>

<script>
/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_APP.firebaseapp.com",
  databaseURL: "https://SEU_APP-default-rtdb.firebaseio.com",
  projectId: "SEU_APP",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= ID DO USUÁRIO ================= */

let userId = localStorage.getItem("userId");

if (!userId) {
  userId = "user_" + Math.random().toString(36).substring(2,8);
  localStorage.setItem("userId", userId);
}

document.getElementById("meuId").textContent = userId;

/* ================= MAPA ================= */

const map = L.map("map").setView([-5.09, -42.80], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

let marker = null;
let watchId = null;
let marcadorOutro = null;

/* ================= INICIAR ================= */

function iniciar() {
  if (!navigator.geolocation) {
    alert("GPS não suportado");
    return;
  }

  watchId = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const acc = pos.coords.accuracy;

    document.getElementById("lat").textContent = lat.toFixed(6);
    document.getElementById("lon").textContent = lon.toFixed(6);
    document.getElementById("acc").textContent = Math.round(acc) + " m";

    if (marker) map.removeLayer(marker);

    marker = L.marker([lat, lon])
      .addTo(map)
      .bindPopup("📍 Você")
      .openPopup();

    map.setView([lat, lon], 17);

    // 🔥 ENVIA PARA O FIREBASE
    db.ref("localizacoes/" + userId).set({
      lat, lon, acc, time: Date.now()
    });

  }, err => {
    alert("Erro: " + err.message);
  }, {
    enableHighAccuracy: true
  });
}

/* ================= PARAR ================= */

function parar() {
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  db.ref("localizacoes/" + userId).remove();
}

/* ================= RASTREAR OUTRO ================= */

function rastrear() {
  const id = document.getElementById("trackInput").value;

  if (!id) {
    alert("Digite um ID");
    return;
  }

  db.ref("localizacoes/" + id).on("value", snap => {
    const data = snap.val();

    if (!data) {
      alert("Usuário offline ou não encontrado");
      return;
    }

    if (marcadorOutro) map.removeLayer(marcadorOutro);

    marcadorOutro = L.marker([data.lat, data.lon])
      .addTo(map)
      .bindPopup("📍 Usuário rastreado")
      .openPopup();

    map.setView([data.lat, data.lon], 17);
  });
}
</script>

</body>
</html>
